apiVersion: apps/v1
kind: Deployment
metadata:
  name: edgevault-frontend
  namespace: edgevault
spec:
  replicas: 2
  selector:
    matchLabels:
      app: edgevault-frontend
  template:
    metadata:
      labels:
        app: edgevault-frontend
    spec:
      containers:
      - name: frontend
        # ?? ?????????? ???: ????? ???? ????? ??? AWS Account ID ??? Region ????!
        image: 872376836172.dkr.ecr.ap-south-1.amazonaws.com/edgevault-frontend:v1
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "250m"
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: edgevault
spec:
  type: ClusterIP
  selector:
    app: edgevault-frontend
  ports:
  - port: 80
    targetPort: 80
